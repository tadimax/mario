<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Super Mario Bros</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="css/game.css" />

    <style>
      #worldSelectOverlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.85);
        z-index: 9999;
        font-family: Arial, sans-serif;
      }
      #worldSelectCard {
        width: min(560px, calc(100% - 32px));
        background: #111;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 18px;
        color: #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
      #worldSelectCard h1 { margin: 0 0 8px 0; font-size: 20px; }
      #worldSelectCard p  { margin: 0 0 14px 0; opacity: 0.85; line-height: 1.3; font-size: 13px; }
      .ws-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
      .ws-btn {
        flex: 1 1 170px;
        background: #222;
        border: 1px solid #444;
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .ws-btn:hover { border-color: #777; }

      #modeBadge {
        margin-top: 10px;
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #444;
        background: #1a1a1a;
        font-size: 12px;
      }

      .seedRow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid #333;
        border-radius: 10px;
        background: #141414;
        font-size: 12px;
      }
      #seedDisplay { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #copySeedBtn {
        margin-left: auto;
        background: #222;
        border: 1px solid #444;
        color: #fff;
        padding: 6px 10px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
      }
      #copySeedBtn:hover { border-color: #777; }
    </style>
  </head>

  <body>
    <!-- World selector overlay -->
    <div id="worldSelectOverlay">
      <div id="worldSelectCard">
        <h1>Select a level</h1>
        <p>
          Choose the authored baseline or a procedural variant.
          Procedural levels are seed-controlled for reproducibility.
        </p>

        <!-- V2 -->
        <div class="ws-row">
          <button class="ws-btn" id="btn11BaseV2">World 1-1 (Baseline – V2)</button>
          <button class="ws-btn" id="btn11PCGV2">World 1-1 (PCG – V2 Beat Genome)</button>
        </div>
        <div class="ws-row">
          <button class="ws-btn" id="btn12SeedV2">World 1-2 (Saved – V2)</button>
        </div>

        <div class="ws-row">
          <button class="ws-btn" id="btn11PCGV24">World 1-1 (PCG V2.4 – +Schemas)</button>
          <button class="ws-btn" id="btn11PCGV25">World 1-1 (PCG V2.5 – +Difficulty Gene)</button>
          <button class="ws-btn" id="btn11PCGV26">World 1-1 (PCG V2.6 – +Novelty)</button>
        </div>


        <!-- V1 -->
        <div class="ws-row">
          <button class="ws-btn" id="btn11BaseV1">World 1-1 (Baseline – V1)</button>
          <button class="ws-btn" id="btn11PCGV1">World 1-1 (PCG – V1 Tile Mutation)</button>
        </div>
        <div class="ws-row">
          <button class="ws-btn" id="btn12SeedV1">World 1-2 (Saved – V1)</button>
        </div>

        <p style="margin-top:12px;font-size:12px;opacity:0.8;">
          Tip: In World 1-1 V2, press <b>T</b> to toggle baseline ↔ PCG (same seed).
        </p>

        <div id="modeBadge">Mode: waiting for selection</div>

        <div class="seedRow">
          <div>Seed:</div>
          <div id="seedDisplay">(none)</div>
          <button id="copySeedBtn" type="button">Copy</button>
        </div>
      </div>
    </div>

    <!-- Core -->
    <script src="js/util.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/input.js"></script>

    <script src="js/entity.js"></script>

    <!-- World / collision primitives -->
    <script src="js/floor.js"></script>
    <script src="js/block.js"></script>
    <script src="js/pipe.js"></script>
    <script src="js/prop.js"></script>
    <script src="js/rubble.js"></script>

    <!-- Items -->
    <script src="js/coin.js"></script>
    <script src="js/bcoin.js"></script>
    <script src="js/mushroom.js"></script>
    <script src="js/fireflower.js"></script>
    <script src="js/star.js"></script>
    <script src="js/fireball.js"></script>

    <!-- Enemies -->
    <script src="js/goomba.js"></script>
    <script src="js/koopa.js"></script>

    <!-- Player + goal -->
    <script src="js/player.js"></script>
    <script src="js/flag.js"></script>

    <!-- Level system -->
    <script src="js/levels/level.js"></script>

    <!-- V1 -->
    <script src="js/levels/11_v1_firstexp.js"></script>
    <script src="js/levels/12_v1_firstexp.js"></script>

    <!-- V2 -->
    <script src="js/levels/11_v2_beats.js"></script>
    <script src="js/levels/11_v2_beats_4.js"></script>
    <script src="js/levels/11_v2_beats_5.js"></script>
    <script src="js/levels/11_v2_beats_6.js"></script>

    <!-- Selector logic -->
    <script src="js/world-select.js"></script>

    <!-- Bootstrap LAST -->
    <script src="js/game.js"></script>

    <div class="info">
      <p class="controls">Move: Arrow Keys, Jump: X, Run: Z, Toggle PCG (1-1 V2): T</p>
    </div>
  </body>
</html>
